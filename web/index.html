<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="World, China and Australia headlines paired with a related Bible verse and reflection.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="News Insights">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>News Insights</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    2026-08-06: the app used to boot to a blank white page while
    main.dart.js downloaded — several seconds on a cold load, with
    nothing on screen to say anything was happening.

    This splash is plain HTML on purpose. A Flutter loading page cannot
    help here: it only appears once the framework is already up, which
    is the part that takes the time. This paints on the first byte, and
    removes itself on Flutter's first frame.
  -->
  <div id="boot">
    <img src="icons/Icon-192.png" alt="" width="88" height="88">
    <div class="t">News Insights</div>
    <div class="z">新闻洞见</div>
    <div class="v">v__APP_VERSION__</div>
  </div>
  <style>
    #boot{position:fixed;inset:0;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:2px;
      background:#FBF3E7;font:400 15px/1.5 -apple-system,BlinkMacSystemFont,
      "Segoe UI",system-ui,sans-serif;color:#5E340A;z-index:9999;
      transition:opacity .28s ease}
    #boot img{border-radius:22%;box-shadow:0 6px 18px rgba(94,52,10,.22);
      margin-bottom:14px}
    #boot .t{font-size:19px;font-weight:600;letter-spacing:.01em}
    #boot .z{font-size:14px;color:#9A5A14;letter-spacing:.24em;
      margin-top:1px}
    #boot .v{margin-top:12px;font-size:11px;opacity:.55;
      font-variant-numeric:tabular-nums}
    #boot.gone{opacity:0;pointer-events:none}
    @media (prefers-color-scheme: dark){
      #boot{background:#1A1206;color:#EBD9BC}
      #boot .z{color:#C9822A}
    }
  </style>
  <script>
    // Remove on Flutter's first frame. The timeout is a floor, not the
    // mechanism — if the app somehow never signals, the splash must
    // still not trap the reader behind it.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.classList.add('gone');
      setTimeout(function () { b.remove(); }, 300);
    });
    setTimeout(function () {
      var b = document.getElementById('boot');
      if (b) { b.classList.add('gone'); setTimeout(function(){ b.remove(); }, 300); }
    }, 12000);
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
